<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="8" fill="#18181b"/>
  <!-- Brain hemispheres & neural network glyph -->
  <g fill="none" stroke="#fafafa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left hemisphere lobes -->
    <path d="M14 8a4 4 0 0 0-4 4c-1.5 0-3 1.2-3 2.8 0 1.2.8 2.2 2 2.6-.5.8-.5 1.8 0 2.6 1 1.6 3 2 5 2" />
    <!-- Right hemisphere lobes -->
    <path d="M18 8a4 4 0 0 1 4 4c1.5 0 3 1.2 3 2.8 0 1.2-.8 2.2-2 2.6.5.8.5 1.8 0 2.6-1 1.6-3 2-5 2" />
    <!-- Central fissure & synaptic bridge -->
    <line x1="16" y1="8" x2="16" y2="24" stroke-dasharray="1 2.5"/>
    <path d="M12 15h8"/>
    <path d="M13 19h6"/>
  </g>
  <!-- Synaptic node accents -->
  <circle cx="12" cy="15" r="1.3" fill="#38bdf8"/>
  <circle cx="20" cy="15" r="1.3" fill="#38bdf8"/>
  <circle cx="16" cy="11" r="1.3" fill="#fafafa"/>
  <circle cx="16" cy="22" r="1.3" fill="#fafafa"/>
</svg>